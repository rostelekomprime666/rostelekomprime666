name: Night Build Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '1 0 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: night-build-snake
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark&color_snake=%23ff9567
            assets/snake-light.svg?palette=github-light&color_snake=%23b54b2b

      - name: Publish refreshed animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/snake-dark.svg assets/snake-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution snake"
            git push origin HEAD:main
          fi
